name: Build UstaGo for Android and iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Setup Clean Android and Web with Firebase
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android
          flutter create . --platforms=android,web --org=com.ustago
          cp /tmp/google-services.json android/app/google-services.json

          # Firebase paket adini eynilesdir
          sed -i 's/"com.ustago.app"/"com.ustago.ustago"/g' android/app/google-services.json

          # Kotlin versiyasini 1.9.24-e yukselt
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle* || true

          # Google Services plugin elave et
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle*
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle*

          # SDK 35 ve minSdk 23 sazla
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle* || true
          sed -i 's/minSdk.*/minSdk = 23/g' android/app/build.gradle* || true
          sed -i 's/targetSdk.*/targetSdk = 35/g' android/app/build.gradle* || true

          # AAPT2 API 35 uyugun versiyani mecbur et (RES_TABLE_TYPE_TYPE xetasini hell edir)
          echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web App (for iOS Safari)
        run: flutter build web --release --base-href "/ustago/"

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UstaGo-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy iOS Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
