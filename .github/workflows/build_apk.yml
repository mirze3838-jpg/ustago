name: Build UstaGo App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Clean Android with Firebase
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android
          flutter create . --platforms=android,web --org=com.ustago
          cp /tmp/google-services.json android/app/google-services.json
          
          # Firebase paket adını eyniləşdir
          sed -i 's/"com.ustago.app"/"com.ustago.ustago"/g' android/app/google-services.json
          
          # Pluginləri və versiyaları düzəlt
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle*
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle*
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle* || true
          sed -i 's/minSdk.*/minSdk = 23/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion.*/minSdkVersion = 23/g' android/app/build.gradle* || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web App (for iPhone / Safari)
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UstaGo-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web App (for iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: UstaGo-iPhone-Web-App
          path: build/web
