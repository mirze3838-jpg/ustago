name: Build UstaGo for Android and iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Fix broken Android SDK 35 (delete and reinstall fresh)
        run: |
          # Siniq android-35 platform-u sil
          rm -rf $ANDROID_SDK_ROOT/platforms/android-35
          rm -rf $ANDROID_SDK_ROOT/build-tools/35*
          # Google serverinden temiz versiyasini yukle
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          # Yuklendiyi dogrula
          ls $ANDROID_SDK_ROOT/platforms/android-35/

      - name: Setup Clean Android and Web with Firebase
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android
          flutter create . --platforms=android,web --org=com.ustago
          cp /tmp/google-services.json android/app/google-services.json

          # Firebase paket adini eynilesdir
          sed -i 's/"com.ustago.app"/"com.ustago.ustago"/g' android/app/google-services.json

          # Kotlin versiyasini yukselt (1.9.24)
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle* || true

          # Google Services plugin elave et
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle*
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle*

          # SDK versiyalarini sazla
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle* || true
          sed -i 's/minSdk.*/minSdk = 23/g' android/app/build.gradle* || true
          sed -i 's/targetSdk.*/targetSdk = 35/g' android/app/build.gradle* || true
          sed -i '/compileSdk = 35/a \    buildToolsVersion = "35.0.0"' android/app/build.gradle* || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web App (for iOS Safari)
        run: flutter build web --release --base-href "/ustago/"

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UstaGo-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy iOS Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
