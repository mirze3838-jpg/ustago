name: Build UstaGo for Android and iOS

on:
  push:
    branches: [ main, test-streaming-upload ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Setup Clean Android and Web with Firebase
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          # Keystore-u base64 olaraq saxlayırıq (imza sabitliyi üçün)
          base64 android/app/debug.keystore > /tmp/debug.keystore.b64
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          mkdir -p /tmp/saved_res && cp -r android/app/src/main/res/mipmap* /tmp/saved_res/ || true
          cp -r web /tmp/saved_web || true
          rm -rf android
          flutter create . --platforms=android,web --org=com.ustago
          cp /tmp/google-services.json android/app/google-services.json
          # Keystore-u geri bərpa et (eyni SHA-1 imzası qalsın)
          base64 -d /tmp/debug.keystore.b64 > android/app/debug.keystore
          cp -r /tmp/saved_res/* android/app/src/main/res/ || true
          cp -r /tmp/saved_web/* web/ || true
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

          # MainActivity-nin paket adını DƏQİQ com.ustago.app et və uyğun qovluqda yarat
          rm -rf android/app/src/main/kotlin/*
          mkdir -p android/app/src/main/kotlin/com/ustago/app
          cat << 'EOF' > android/app/src/main/kotlin/com/ustago/app/MainActivity.kt
          package com.ustago.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # Paket adini com.ustago.app olaraq teyin et (Firebase ile tam eyni olmalidir)
          sed -i 's/applicationId = ".*"/applicationId = "com.ustago.app"/g' android/app/build.gradle* || true
          sed -i 's/applicationId ".*"/applicationId "com.ustago.app"/g' android/app/build.gradle* || true
          sed -i 's/namespace = ".*"/namespace = "com.ustago.app"/g' android/app/build.gradle* || true
          sed -i 's/namespace ".*"/namespace "com.ustago.app"/g' android/app/build.gradle* || true
          sed -i 's/package="com.ustago.ustago"/package="com.ustago.app"/g' android/app/src/main/AndroidManifest.xml || true

          # Kotlin versiyasini 1.9.24-e yukselt
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle* || true

          # Google Services plugin elave et
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle*
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle*

          # Keystore sazlamasi (Sabit SHA-1 ile imzalama)
          sed -i '/buildTypes {/i \    signingConfigs { release { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }' android/app/build.gradle*
          sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.release/g' android/app/build.gradle* || true
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle* || true

          # SDK 35, minSdk 23 ve MultiDex aktivlesdir (Crashlerin qarsisini alir)
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle* || true
          sed -i 's/minSdk.*/minSdk = 23\n        multiDexEnabled = true/g' android/app/build.gradle* || true
          sed -i 's/targetSdk.*/targetSdk = 35/g' android/app/build.gradle* || true

          # AAPT2 API 35 uyugun versiyani mecbur et (RES_TABLE_TYPE_TYPE xetasini hell edir)
          echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ustago.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UstaGo-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Update GitHub Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: UstaGo v1.0.0 (Android APK)
          files: build/app/outputs/flutter-apk/ustago.apk
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test APK to Pre-Release
        if: github.ref == 'refs/heads/test-streaming-upload'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-test
          name: UstaGo TEST (Streaming Upload)
          files: build/app/outputs/flutter-apk/ustago.apk
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web App (for iOS Safari)
        if: github.ref == 'refs/heads/main'
        run: flutter build web --release --base-href "/ustago/" --no-tree-shake-icons

      - name: Deploy iOS Web App to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
