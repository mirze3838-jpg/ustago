name: ustago
description: UstaGo usta xidmətləri mobil tətbiqi
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase xidmətləri
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  
  # Google ilə giriş
  google_sign_in: ^6.2.2
  
  # Şəkil və Video seçmək
  image_picker: ^1.1.2
  
  # Video oynatmaq (tətbiqdaxili baxış üçün)
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
